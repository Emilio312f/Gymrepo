name: Desplegar web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Instalar dependencias
        working-directory: frontend
        run: flutter pub get

      - name: Compilar web (apuntando al backend en Render)
        working-directory: frontend
        run: |
          flutter build web --release \
            --base-href /Gymrepo/ \
            --dart-define=API_URL=https://gymcontrol-api-y5v2.onrender.com/api/v1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

      - id: deployment
        uses: actions/deploy-pages@v4
