services:
  - type: web
    name: gymcontrol-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gymcontrol-db
          property: connectionString

databases:
  - name: gymcontrol-db
    plan: free
    region: oregon
